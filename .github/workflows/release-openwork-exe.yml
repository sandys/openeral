name: Release OpenWork Windows EXE

# Builds the OpenWork Electron desktop app (the main product) as a Windows
# NSIS installer and publishes it to a GitHub release on THIS repository.
#
# The release step deliberately does NOT hardcode an owner/repo, so the
# installer is attached to whatever repo the workflow runs in. On merge into
# `just-bash` of stringcost/openeral that means the release lands on
# stringcost/openeral.
#
# Trigger: push to `just-bash` (i.e. a merged PR) that touches the openwork
# desktop sources or this workflow. There is no scheduled or external trigger,
# so it only ever runs when something relevant lands on `just-bash`. Manual
# `workflow_dispatch` is available for ad-hoc rebuilds.
#
# Supply-chain hardening: every third-party action is pinned to a full commit
# SHA (version noted in a trailing comment). Dependabot keeps these current —
# see .github/dependabot.yml. Runners are pinned to explicit OS versions so a
# silent runner upgrade can't change the produced artifact.
#
# Mirrors the canonical two-job path from
# openwork/.github/workflows/build-windows-openshell.yml, repathed for the
# vendored `openwork/` subtree:
#   1. build-rootfs  (ubuntu) — Docker-bake the Ubuntu 24.04 + OpenShell WSL
#      rootfs that installer.mjs phaseDistro imports via `wsl --import`.
#   2. build-and-release (windows) — pull the rootfs into resources/openshell,
#      build the renderer + Electron main + sidecars, package the NSIS
#      installer, and attach it to a GitHub release.

on:
  push:
    branches:
      - just-bash
    paths:
      - openwork/apps/app/**
      - openwork/apps/desktop/**
      - openwork/packages/ui/**
      - openwork/constants.json
      - openwork/pnpm-lock.yaml
      - openwork/package.json
      - .github/workflows/release-openwork-exe.yml
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = openwork-v<version>-r<run_number>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-rootfs:
    name: Build OpenShell rootfs (Ubuntu)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Docker is pre-installed on GitHub-hosted ubuntu runners.
      - name: Build rootfs tarball
        working-directory: openwork
        run: bash ./apps/desktop/scripts/build-openshell-rootfs.sh

      - name: Verify rootfs artifact
        working-directory: openwork
        run: |
          set -e
          test -f apps/desktop/resources/openshell/ubuntu-24.04-openshell.tar.gz
          ls -la apps/desktop/resources/openshell/

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openshell-rootfs
          path: openwork/apps/desktop/resources/openshell/ubuntu-24.04-openshell.tar.gz
          retention-days: 7
          if-no-files-found: error

  build-and-release:
    name: Package NSIS installer (Windows) + release
    needs: build-rootfs
    runs-on: windows-2022
    defaults:
      run:
        working-directory: openwork
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Pull the rootfs the previous job produced into the path
      # electron-builder.yml's win.extraResources rule expects.
      - name: Download rootfs artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openshell-rootfs
          path: openwork/apps/desktop/resources/openshell

      - name: Verify rootfs landed in resources path
        shell: pwsh
        run: |
          $rootfs = "apps/desktop/resources/openshell/ubuntu-24.04-openshell.tar.gz"
          if (-not (Test-Path $rootfs)) {
            Write-Error "Expected rootfs at $rootfs but it is missing."
            exit 1
          }
          Get-Item $rootfs | Select-Object FullName, Length

      # pnpm before setup-node so setup-node finds pnpm on PATH.
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.27.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version-file: openwork/.nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron renderer + main + sidecars
        run: pnpm --filter @openwork/desktop run build:electron

      # --publish never: electron-builder.yml's publish block points at the
      # upstream openwork repo; we attach the asset to this repo's release
      # ourselves below. --win nsis pins the installer target.
      - name: Package NSIS installer
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --win nsis --publish never

      - name: Resolve version and tag
        id: meta
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $tag = "${{ github.event.inputs.tag }}"
          # Push-triggered (and dispatch-without-tag) runs can repeat for the
          # same package.json version, so default tags carry the run number to
          # stay unique — otherwise a reused tag hard-fails action-gh-release.
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = "openwork-v$version-r${{ github.run_number }}" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: List built artifacts
        shell: pwsh
        run: Get-ChildItem apps/desktop/dist-electron -File | Select-Object Name, Length

      # dist-electron's root contains exactly one .exe (the NSIS installer);
      # the unpacked app + sidecar .exes live under win-unpacked/, which this
      # non-recursive glob does not match. Avoids depending on the exact
      # ${os} expansion in electron-builder.yml's artifactName template.
      - name: Create GitHub release and upload installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: OpenWork ${{ steps.meta.outputs.version }} (Windows)
          body: |
            OpenWork desktop (Electron) Windows NSIS installer.

            Built from the `openwork/` subtree at commit ${{ github.sha }}.
            Bundles the Ubuntu 24.04 + OpenShell WSL rootfs.

            **Note:** unsigned build — Windows SmartScreen may warn on first run.
          files: openwork/apps/desktop/dist-electron/*.exe
          fail_on_unmatched_files: true
