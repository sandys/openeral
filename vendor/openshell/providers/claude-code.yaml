id: claude-code
display_name: Claude Code
description: Claude Code CLI
category: agent
inference_capable: true
credentials:
  - name: api_key
    description: Anthropic API key used by Claude Code
    env_vars: [ANTHROPIC_API_KEY, CLAUDE_API_KEY]
    required: true
    auth_style: header
    header_name: x-api-key
discovery:
  credentials: [api_key]
endpoints:
  - host: api.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: statsig.anthropic.com
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
  - host: sentry.io
    port: 443
    protocol: rest
    access: read-write
    enforcement: enforce
# Openrind Shell keeps a small durability wrapper at /usr/local/bin/claude and
# moves the native Claude Code executable to claude-real. Include both paths so
# provider-managed ANTHROPIC_API_KEY injection follows the process that actually
# opens the Anthropic connection.
binaries: [/usr/bin/claude, /usr/local/bin/claude, /usr/local/bin/claude-real]
