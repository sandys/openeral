services:
  openrind-desktop-host:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Keep this in sync with apps/orchestrator/package.json if you want a pinned release.
        OPENRIND_DESKTOP_ORCHESTRATOR_VERSION: 0.11.22
    ports:
      - "8787:8787"
    environment:
      # Set these explicitly for stable sharing.
      # OPENRIND_DESKTOP_TOKEN: "..."
      # OPENRIND_DESKTOP_HOST_TOKEN: "..."
      # Optional: OPENRIND_DESKTOP_APPROVAL_MODE: "auto"
      # Optional: OPENRIND_DESKTOP_APPROVAL_TIMEOUT_MS: "30000"
      OPENRIND_DESKTOP_DATA_DIR: /data/openrind-desktop-orchestrator
      OPENRIND_DESKTOP_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
