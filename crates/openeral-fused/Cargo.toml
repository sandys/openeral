[package]
name = "openeral-fused"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "openeral-fused"
path = "src/main.rs"

[dependencies]
bytes = "1"
dashmap = "6"
fuser = "0.17"
hex = "0.4"
libc = "0.2"
parking_lot = "0.12"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["array-impls", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "0.14", features = ["native-certs", "ring"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
